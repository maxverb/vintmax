<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vintmax</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #fafafa;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      .card { background: #1a1a1a; border-color: #333; }
      .card:hover { border-color: #666; }
      input, select { background: #1a1a1a; color: #eee; border-color: #333; }
      .meta, .subtitle { color: #999; }
    }
    header { max-width: 1200px; margin: 0 auto 20px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .subtitle { font-size: 13px; color: #666; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    input, select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
      background: #fff;
    }
    input[type="search"] { flex: 1; min-width: 200px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 8px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #666; }
    .card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
    }
    .title {
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta { font-size: 11px; color: #666; margin-top: 4px; }
    .price { font-weight: 600; margin-top: 4px; font-size: 13px; }
    .empty { text-align: center; padding: 48px; color: #888; }
    mark { background: #ffe680; color: inherit; padding: 0 2px; border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Vintmax</h1>
    <div class="subtitle" id="status">Laden...</div>
  </header>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter binnen resultaten (titel/merk)...">
    <select id="sort">
      <option value="newest">Nieuwste eerst</option>
      <option value="price-asc">Prijs: laag naar hoog</option>
      <option value="price-desc">Prijs: hoog naar laag</option>
      <option value="title">Titel A-Z</option>
    </select>
    <select id="size">
      <option value="">Alle maten</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const qInput = document.getElementById("q");
    const sortSel = document.getElementById("sort");
    const sizeSel = document.getElementById("size");
    let ALL = [];

    function priceNum(item) {
      const m = /([\d.,]+)/.exec(item.price || "");
      if (!m) return Infinity;
      return parseFloat(m[1].replace(",", "."));
    }

    function escapeHTML(s) {
      return (s || "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function highlight(text, needle) {
      const safe = escapeHTML(text);
      if (!needle) {
        return safe.replace(/\b(max(?:imaal|imum|imal|imize)?)\b/gi, "<mark>$1</mark>");
      }
      try {
        const re = new RegExp(`(${needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
        return safe.replace(re, "<mark>$1</mark>");
      } catch {
        return safe;
      }
    }

    function render() {
      const q = qInput.value.trim().toLowerCase();
      const sortBy = sortSel.value;
      const size = sizeSel.value;
      let items = ALL.filter(it => {
        if (size && it.size !== size) return false;
        if (q) {
          const hay = `${it.title} ${it.brand}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      if (sortBy === "price-asc") items.sort((a, b) => priceNum(a) - priceNum(b));
      else if (sortBy === "price-desc") items.sort((a, b) => priceNum(b) - priceNum(a));
      else if (sortBy === "title") items.sort((a, b) => a.title.localeCompare(b.title));

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty">Geen resultaten.</div>`;
        return;
      }
      grid.innerHTML = items.map(it => `
        <a class="card" href="${escapeHTML(it.url)}" target="_blank" rel="noopener">
          ${it.photo ? `<img src="${escapeHTML(it.photo)}" loading="lazy" alt="">` : ""}
          <div class="title">${highlight(it.title, q)}</div>
          <div class="meta">${escapeHTML(it.brand || "—")}${it.size ? ` · ${escapeHTML(it.size)}` : ""}</div>
          <div class="price">${escapeHTML(it.price || "")}</div>
        </a>
      `).join("");
    }

    async function load() {
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        ALL = data.items || [];
        const when = data.generated_at ? new Date(data.generated_at).toLocaleString("nl-NL") : "—";
        statusEl.textContent = `${data.count ?? ALL.length} hits voor "${data.query}" · laatst ververst: ${when}`;
        const sizes = [...new Set(ALL.map(i => i.size).filter(Boolean))].sort();
        for (const s of sizes) {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          sizeSel.appendChild(opt);
        }
        render();
      } catch (e) {
        statusEl.textContent = `Kon data.json niet laden: ${e.message}. Run de GitHub Action om resultaten te genereren.`;
      }
    }

    qInput.addEventListener("input", render);
    sortSel.addEventListener("change", render);
    sizeSel.addEventListener("change", render);
    load();
  </script>
</body>
</html>
